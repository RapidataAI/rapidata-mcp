[left_out.scheduled_jobs]
why = "Signals (scheduled jobs) are made for code that runs continuously, not for a chat."
functions = [
  "RapidataSignal.delete",
  "RapidataSignal.description",
  "RapidataSignal.get_jobs",
  "RapidataSignal.interval_hours",
  "RapidataSignal.is_paused",
  "RapidataSignal.last_run_at",
