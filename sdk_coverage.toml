# Every public rapidata SDK function: exposed by an MCP tool, or left out and why.
# `python -m rapidata_mcp.coverage` checks it against the installed SDK.

[exposed.upload_media]
functions = [
  "RapidataAssetManager.upload",
]

[exposed.create_classification_task]
functions = [
  "RapidataJobManager.create_classification_job_definition",
  "RapidataJobDefinition.estimated_cost",
]

[exposed.create_comparison_task]
functions = [
  "RapidataJobManager.create_compare_job_definition",
  "RapidataJobDefinition.estimated_cost",
]

[exposed.start_job]
functions = [
  "RapidataJobManager.get_job_definition_by_id",
  "RapidataAudienceManager.get_audience_by_id",
  "RapidataAudience.filter",
  "RapidataAudience.get_recruiting_metrics",
  "RapidataAudience.assign_job",
  "RapidataAudience.name",
  "RapidataFilteredAudience.assign_job",
  "RapidataUnlistedAudience.assign_job",
  "RapidataUnlistedAudience.name",
  "RapidataJob.get_status",
]

[exposed.get_job_status]
functions = [
  "RapidataJobManager.get_job_by_id",
  "RapidataJob.get_progress",
]

[exposed.get_job_results]
functions = [
  "RapidataJob.get_results",
]

[exposed.list_jobs]
functions = [
  "RapidataJobManager.find_jobs",
]

[exposed.pause_job]
functions = [
  "RapidataJob.pause",
]

[exposed.resume_job]
functions = [
  "RapidataJob.resume",
]

[exposed.get_account_balance]
functions = [
  "RapidataBillingManager.get_outstanding_balance",
]

