[left_out.editing_job_definitions]
why = "Editing or deleting a job definition adds little: a new draft is free."
functions = [
  "RapidataJobDefinition.answer_options",
  "RapidataJobDefinition.base_revision",
  "RapidataJobDefinition.dataset_id",
  "RapidataJobDefinition.delete",
  "RapidataJobDefinition.discard_changes",
  "RapidataJobDefinition.has_unsaved_changes",
