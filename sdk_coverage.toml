  "RapidataJobDefinition.wait_until_ready",
  "RapidataJobManager.find_job_definitions",
]

[left_out.other_task_types]
why = "Locate, draw, select words, free text and ranking each need their own tool; add one when users ask for it."
functions = [
  "RapidataJobManager.create_draw_job_definition",
  "RapidataJobManager.create_free_text_job_definition",
  "RapidataJobManager.create_locate_job_definition",
  "RapidataJobManager.create_ranking_job_definition",
  "RapidataJobManager.create_select_words_job_definition",
]

[left_out.building_audiences]
why = "Building a custom audience needs at least 10 hand-checked example questions and days of recruiting; once built in the dashboard, start_job takes its id."
functions = [
