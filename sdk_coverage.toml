  "RapidataSignalManager.get_signal_by_id",
]

[left_out.billing_period]
why = "get_current_billing_period also needs an active billing period, which new accounts lack; get_account_balance reads GET /billing/summary instead."
functions = [
  "RapidataBillingManager.get_current_billing_period",
]

[left_out.client_setup]
why = "Credentials and caches of the client: the server builds one per request from the caller's token."
functions = [
  "RapidataClient.clear_all_caches",
  "RapidataClient.get_token",
  "RapidataClient.maintain_token_file",
  "RapidataClient.reset_credentials",
  "RapidataClient.set_token",
]

[left_out.script_helpers]
why = "Made for a script: opens a browser, prints, converts results, or reports what the job tools already return."
functions = [
  "FailedUpload.format_error_details",
  "FailedUpload.from_exception",
  "RapidataJob.completed_at",
  "RapidataJob.display_progress_bar",
  "RapidataJob.estimated_cost",
  "RapidataJob.pipeline_id",
  "RapidataJob.view",
  "RapidataResults.to_json",
  "RapidataResults.to_pandas",
]

[left_out.deleting_jobs]
why = "pause_job already stops the spend, and a deletion can't be undone from a chat."
functions = [
  "RapidataJob.delete",
]

[left_out.shortening_contexts]
why = "Shortens context text with a model for scripts; an assistant shortens its own text."
functions = [
  "ContextManager.shorten_context",
  "ContextManager.shorten_contexts",
]
