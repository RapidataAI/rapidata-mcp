name: Build and push image

on:
  push:
    branches: [main]

# The infrastructure dispatch is last-write-wins, so deploys finish in push order.
concurrency:
  group: push-main-deploy
  cancel-in-progress: false

env:
  REGION: europe-west4
  GAR_LOCATION: europe-west4-docker.pkg.dev/${{ secrets.GCP_COMMON_PROJECT_ID }}/rapidata-internal

jobs:
  create_version:
    name: Create new version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.versioning.outputs.NEW_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate next version
        id: versioning
        run: |
          TIMESTAMP=$(date -u +'%Y.%m.%d.%H%M')
          GIT_HASH=$(git rev-parse --short HEAD)
          NEW_TAG="${TIMESTAMP}-${GIT_HASH}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "::notice ::New version: $NEW_TAG"

      - name: Push tag
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.versioning.outputs.NEW_TAG }}',
              sha: context.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ steps.versioning.outputs.NEW_TAG }}',
                sha: context.sha
              });
            });

  build-and-push:
    needs: [create_version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.create_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GAR_LOCATION }}/rapidataai/rapidata-mcp
          tags: type=raw,value=${{ env.VERSION }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: RAPIDATA_MCP_IMAGE_TAG=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint python \
            "${{ env.GAR_LOCATION }}/rapidataai/rapidata-mcp:${{ env.VERSION }}" \
            -c 'import rapidata_mcp; rapidata_mcp.build_app(rapidata_mcp.Settings(auth_disabled=True))'

      - name: Push
        run: docker push "${{ env.GAR_LOCATION }}/rapidataai/rapidata-mcp:${{ env.VERSION }}"

      # ArgoCD auto-syncs services/rapidata-mcp once infrastructure's update-images.yml
      # commits the new tag into the overlay.
      - name: Create infrastructure app token
        uses: actions/create-github-app-token@v3
        id: infra-token
        with:
          app-id: ${{ vars.ARGOCD_APP_ID }}
          private-key: ${{ secrets.ARGOCD_APP_PRIVATE_KEY }}
          owner: RapidataAI
          repositories: infrastructure

      - name: Deploy — bump test image tag
        uses: octokit/request-action@v3.0.0
        with:
          route: POST /repos/{owner}/{repo}/dispatches
          owner: RapidataAI
          repo: infrastructure
          event_type: update-image-tags
          client_payload: '{"tag": "${{ env.VERSION }}", "type": "rapidata-mcp", "overlay": "test"}'
        env:
          GITHUB_TOKEN: ${{ steps.infra-token.outputs.token }}

      - name: Deploy — bump prod image tag
        uses: octokit/request-action@v3.0.0
        with:
          route: POST /repos/{owner}/{repo}/dispatches
          owner: RapidataAI
          repo: infrastructure
          event_type: update-image-tags
          client_payload: '{"tag": "${{ env.VERSION }}", "type": "rapidata-mcp", "overlay": "prod"}'
        env:
          GITHUB_TOKEN: ${{ steps.infra-token.outputs.token }}
